name: api

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/api.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies (api package only)
        run: uv sync --package api --frozen

      - name: Lint (ruff check)
        run: uv run --package api ruff check .

      - name: Format check (ruff format)
        run: uv run --package api ruff format --check .

     # - name: Test
      #  run: uv run --package api pytest